<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding so emojis and symbols display correctly -->
    <meta charset="UTF-8">

    <!-- Crucial mobile tag: prevents zooming out and makes it fit phone screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AQUADIVI • Gym Water Tracker</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="manifest" href="manifest.json">

    <!-- Connects our upcoming CSS stylesheet -->
    <link rel="stylesheet" href="style.css?v=2">

</head>

<body>

    <!-- Main Phone Container -->
    <div class="app-container">

        <!-- Top Header -->
        <header class="app-header">
            <div class="brand">
               
<div class="login-badge">
    <img src="icon.svg" alt="AQUADIVI Logo" class="login-logo-img">
</div>

                <div>
                    <h1 class="brand-title">AQUADIVI</h1>
                    <p class="brand-subtitle">Gym Hydration Tracker</p>
                    <div id="user-chip" class="user-chip hidden">
    <span id="user-name">⚡ Gym Rat</span>
    <button id="logout-btn" class="logout-btn">Logout</button>
</div>

                </div>
            </div>
        </header>
                

                <!-- SCREEN 1: LOGIN / WELCOME SCREEN -->
        <section id="login-screen" class="screen-card login-screen">
            <div class="login-hero">
                <div class="login-badge">💧</div>
                <h2 class="login-title">Lock In Your Hydration</h2>
                <p class="login-desc">Track every milliliter. Never lose your gym water streak.</p>
            </div>

            <button id="google-login-btn" class="btn-google-auth">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <button id="guest-btn" class="btn-guest-auth">
                Continue as Guest (Offline)
            </button>
        </section>


                <!-- Main Screen -->
        <main id="dashboard-screen" class="main-content hidden">


            <!-- Hero Water Gauge Card -->
            <section class="gauge-card">

                <!-- Circular Progress Ring -->
                <div class="ring-wrapper">
                    <svg class="ring-svg" viewBox="0 0 240 240">
                        <circle class="ring-track" cx="120" cy="120" r="100"></circle>
                        <circle class="ring-progress" id="progressRing" cx="120" cy="120" r="100"></circle>
                    </svg>

                    <!-- Inside Ring Content -->
                    <div class="ring-content">
                        <span class="pct-badge" id="pctBadge">0%</span>
                        <div class="amount-group">
                            <span class="main-val" id="currentAmount">0</span>
                            <span class="unit-val">ml</span>
                        </div>
                        <div class="liters-val" id="currentLiters">0.00 L</div>
                        <p class="target-text">Goal: <strong id="goalDisplay">4,000</strong> ml (<span id="goalLitersDisplay">4.0 L</span>)</p>
                    </div>
                </div>

                <!-- Remaining Status Pill -->
                <div class="status-pill" id="statusPill">
                    <span id="remainingText">4,000 ml remaining today</span>
                </div>

                <!-- Gym Target Quick Switcher -->
                <div class="target-presets">
                    <span class="preset-title">TARGET:</span>
                    <button class="target-pill" data-target="3500">3.5L</button>
                    <button class="target-pill active" data-target="4000">4.0L</button>
                    <button class="target-pill" data-target="4500">4.5L</button>
                    <button class="target-pill" data-target="5000">5.0L</button>
                </div>

            </section>

            <!-- 1-Tap Quick Gym Drink Buttons -->
            <section class="card-section">
                <div class="section-head">
                    <h2 class="section-title">LOG DRINK</h2>
                    <button id="undoBtn" class="undo-btn" title="Undo last drink">â†© Undo</button>
                </div>

                <div class="drinks-grid">
                    <button class="drink-btn" data-amount="250">
                        <span class="drink-emoji">🥛</span>
                        <span class="drink-vol">+250 ml</span>
                        <span class="drink-name">Pre-Workout</span>
                    </button>

                    <button class="drink-btn" data-amount="500">
                        <span class="drink-emoji">🧴</span>
                        <span class="drink-vol">+500 ml</span>
                        <span class="drink-name">Water Bottle</span>
                    </button>

                    <button class="drink-btn" data-amount="700">
                        <span class="drink-emoji">💧</span>
                        <span class="drink-vol">+700 ml</span>
                        <span class="drink-name">Shaker Bottle</span>
                    </button>

                    <button class="drink-btn" data-amount="1000">
                        <span class="drink-emoji">🫙</span>
                        <span class="drink-vol">+1000 ml</span>
                        <span class="drink-name">1L Gallon Jug</span>
                    </button>
                </div>
            </section>

            <!-- Past Days / Monthly History -->
            <section class="card-section">
                <h2 class="section-title">HISTORY (PAST DAYS)</h2>
                <div class="history-list" id="historyList">
                    <!-- JavaScript will show past days here -->
                    <p class="empty-history">Your daily history will show here!</p>
                </div>
            </section>

        </main>


       
    </div>

    <!-- Connects our JavaScript file -->
    <!-- FIREBASE SDKS -->

  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Your Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCwgJSAue2wgf3eeUeqQ9RhgLuzjxqkGDU",
    authDomain: "ali-n8n-access.firebaseapp.com",
    projectId: "ali-n8n-access",
    storageBucket: "ali-n8n-access.firebasestorage.app",
    messagingSenderId: "578593559850",
    appId: "1:578593559850:web:0e0790d9254f0b125afa53"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.googleProvider = new GoogleAuthProvider();
  window.db = getFirestore(app);
  window.fbOps = { signInWithPopup, signOut, onAuthStateChanged, doc, setDoc, getDoc };
</script>

<script src="app.js"></script>

</body>

</html>
